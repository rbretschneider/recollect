<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Maskable variant: full-bleed background (the platform crops its own shape),
    polaroid stack scaled into the central safe zone.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d92e8"/>
      <stop offset="1" stop-color="#45619f"/>
    </linearGradient>
    <linearGradient id="shot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.55" stop-color="#f7768e"/>
      <stop offset="1" stop-color="#8a5aa8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <!-- back polaroid -->
    <g transform="rotate(-16 256 268)">
      <rect x="146" y="120" width="220" height="268" rx="14" fill="#0d1220" opacity="0.28"/>
      <rect x="140" y="114" width="220" height="268" rx="14" fill="#e8e6df" opacity="0.55"/>
    </g>
    <!-- middle polaroid -->
    <g transform="rotate(9 256 268)">
      <rect x="146" y="122" width="220" height="268" rx="14" fill="#0d1220" opacity="0.28"/>
      <rect x="140" y="116" width="220" height="268" rx="14" fill="#f2f0ea" opacity="0.8"/>
    </g>
    <!-- front polaroid -->
    <g transform="rotate(-4 256 268)">
      <rect x="142" y="126" width="228" height="276" rx="14" fill="#0d1220" opacity="0.35"/>
      <rect x="136" y="120" width="228" height="276" rx="14" fill="#fbfaf6"/>
      <rect x="154" y="138" width="192" height="176" rx="6" fill="url(#shot)"/>
      <circle cx="306" cy="176" r="20" fill="#fff8ef" opacity="0.9"/>
      <path d="M162 352 q14 -16 28 0 t28 0 t28 0 t28 0"
            fill="none" stroke="#8b8677" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="322" cy="352" r="6" fill="#8b8677" opacity="0.85"/>
    </g>
  </g>
</svg>

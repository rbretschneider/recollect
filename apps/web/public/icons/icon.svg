<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Recollect: a photo becoming a memory (frame + sun/hills + memory spark). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb3ff"/>
      <stop offset="1" stop-color="#5b7fd4"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- sun -->
  <circle cx="340" cy="182" r="46" fill="#fff" opacity="0.95"/>
  <!-- hills -->
  <path d="M96 356 L208 236 L282 312 L338 260 L416 356 Z" fill="#fff" opacity="0.95"/>
  <path d="M96 356 h320 v28 a24 24 0 0 1 -24 24 H120 a24 24 0 0 1 -24 -24 Z" fill="#fff" opacity="0.55"/>
  <!-- memory spark -->
  <path d="M150 150 l10 -34 10 34 34 10 -34 10 -10 34 -10 -34 -34 -10 Z" fill="#fff" opacity="0.9"/>
</svg>

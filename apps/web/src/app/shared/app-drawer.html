<div class="scrim" (click)="closed.emit()"></div>
<aside class="drawer" role="dialog" aria-modal="true" aria-label="Menu" overlayFocus>
  <header class="account">
    <span class="avatar" aria-hidden="true">{{ userInitial }}</span>
    <div>
      <h2>{{ userName }}</h2>
      <p>{{ userEmail }}</p>
      <p class="grant">{{ grantLabel }}</p>
    </div>
  </header>

  <nav class="items">
    <a routerLink="/" (click)="closed.emit()">
      <span class="icon" aria-hidden="true">🏠</span> Home
    </a>
    <a routerLink="/photos" (click)="closed.emit()">
      <span class="icon" aria-hidden="true">🖼️</span> Photos
    </a>
    <a routerLink="/memories" (click)="closed.emit()">
      <span class="icon" aria-hidden="true">✨</span> Memories
    </a>
    <a routerLink="/albums" (click)="closed.emit()">
      <span class="icon" aria-hidden="true">📔</span> Albums
    </a>
    <a routerLink="/people" (click)="closed.emit()">
      <span class="icon" aria-hidden="true">🙂</span> People
    </a>
    <a routerLink="/places" (click)="closed.emit()">
      <span class="icon" aria-hidden="true">📍</span> Places
    </a>
    <a routerLink="/folders" (click)="closed.emit()">
      <span class="icon" aria-hidden="true">📁</span> Folders
    </a>
    @if (canDelete) {
      <a routerLink="/trash" (click)="closed.emit()">
        <span class="icon" aria-hidden="true">🗑</span> Trash
      </a>
    }
    @if (isAdmin) {
      <hr />
      <a routerLink="/library" (click)="closed.emit()">
        <span class="icon" aria-hidden="true">🗂️</span> Library
      </a>
      <a routerLink="/settings" (click)="closed.emit()">
        <span class="icon" aria-hidden="true">⚙️</span> Settings
      </a>
    }
  </nav>

  <footer>
    @if (pwa.canPrompt()) {
      <button type="button" class="install-cta" (click)="pwa.prompt(); closed.emit()">
        <span aria-hidden="true">📲</span> Install the app
      </button>
    }
  </footer>
</aside>

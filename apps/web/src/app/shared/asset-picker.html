<div class="scrim" (click)="cancel()"></div>

<section class="picker" role="dialog" aria-label="Add photos">
  <header>
    <h2>Add photos</h2>
    <span class="chosen">{{ chosenCount() }} selected</span>
  </header>

  <div class="grid">
    @for (asset of items(); track asset.id) {
      <button
        type="button"
        class="tile"
        [class.chosen]="isChosen(asset.id)"
        [class.excluded]="isExcluded(asset.id)"
        [disabled]="isExcluded(asset.id)"
        [attr.aria-pressed]="isChosen(asset.id)"
        aria-label="Photo"
        (click)="toggle(asset.id)"
      >
        <img [src]="thumbUrl(asset.id)" alt="" loading="lazy" />
        @if (isExcluded(asset.id)) {
          <span class="badge">Added</span>
        } @else if (isChosen(asset.id)) {
          <span class="check" aria-hidden="true">✓</span>
        }
      </button>
    }
  </div>

  @if (!isComplete()) {
    <button type="button" class="more" [disabled]="isLoading()" (click)="loadMore()">
      {{ isLoading() ? 'Loading…' : 'Load more' }}
    </button>
  }

  <footer class="actions">
    <button type="button" class="ghost" (click)="cancel()">Cancel</button>
    <button type="button" class="primary" [disabled]="chosenCount() === 0" (click)="confirm()">
      Add {{ chosenCount() }} {{ chosenCount() === 1 ? 'photo' : 'photos' }}
    </button>
  </footer>
</section>

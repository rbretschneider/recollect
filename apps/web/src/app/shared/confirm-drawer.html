@if (confirms.pending(); as pending) {
  <app-sheet
    [sheetTitle]="pending.title"
    initialFocus=".ghost"
    [danger]="pending.danger !== false"
    (closed)="confirms.settle(false)"
  >
    <p class="message">{{ pending.message }}</p>
    <div class="actions">
      <button type="button" class="ghost" (click)="confirms.settle(false)">Cancel</button>
      <button
        type="button"
        class="confirm"
        [class.danger]="pending.danger !== false"
        (click)="confirms.settle(true)"
      >
        {{ pending.confirmLabel }}
      </button>
    </div>
  </app-sheet>
}

<app-sheet sheetTitle="Add to memory" initialFocus=".filter" (closed)="cancelled.emit()">
  <input
    class="filter"
    name="filterText"
    type="search"
    placeholder="Find or name a memory…"
    autocomplete="off"
    [ngModel]="filterText()"
    (ngModelChange)="filterText.set($event)"
  />

  <div class="list">
    @for (memory of filtered(); track memory.id) {
      <button type="button" (click)="choose(memory.id)">
        @if (coverUrl(memory); as cover) {
          <img [src]="cover" alt="" loading="lazy" />
        } @else {
          <span class="cover-fallback" aria-hidden="true">✨</span>
        }
        <span class="text">
          <span class="title">{{ memory.title }}</span>
          <span class="span">{{ spanLabel(memory) }}</span>
        </span>
        <span class="count">{{ memory.assetCount }}</span>
      </button>
    }
    @if (canCreate()) {
      <button type="button" class="create" [disabled]="isBusy()" (click)="createAndChoose()">
        <span class="cover-fallback" aria-hidden="true">＋</span>
        <span class="text">
          <span class="title">Create “{{ filterText().trim() }}”</span>
        </span>
      </button>
    }
    @if (filtered().length === 0 && !canCreate()) {
      <p class="hint">Type a name to create your first memory.</p>
    }
  </div>
</app-sheet>

<header class="topbar">
  <app-menu-button />
  <app-back to="/" label="Home" />
  <h1>Trash</h1>
  <span class="spacer"></span>
  <app-account-badge />
</header>

<main class="trash">
  @if (loadFailed()) {
    <app-load-error message="Couldn’t load Trash." (retry)="reload()" />
  } @else if (!isLoaded()) {
    <app-page-loading label="Loading trash…" />
  }
  @if (isLoaded() && items().length === 0) {
    <section class="empty">
      <h2>Trash is empty</h2>
      <p>Deleted photos wait here before being removed for good.</p>
    </section>
  }

  @for (item of items(); track item.assetId) {
    <article class="row">
      <img [src]="thumbUrl(item.assetId)" alt="" loading="lazy" />
      <div class="info">
        <h3>{{ item.fileName }}</h3>
        <p>Deletes forever in {{ daysUntilPurge(item) }} days</p>
      </div>
      <button type="button" [disabled]="restoringId() === item.assetId" (click)="restore(item)">
        {{ restoringId() === item.assetId ? 'Restoring…' : 'Restore' }}
      </button>
    </article>
  }
</main>

<header class="topbar">
  <app-back to="/" label="Back to photos" />
  <h1>Logs</h1>
  <app-activity-spinner />
  <span class="spacer"></span>
  <button type="button" class="topbar-action" (click)="toggleFollowing()">
    {{ isFollowing() ? 'Pause' : 'Follow' }}
  </button>
  <a class="topbar-action" [href]="downloadUrl" download>Download</a>
  <span class="spacer"></span>
  <app-menu-button />
</header>

<main class="logs">
  @if (error(); as message) {
    <p class="hint error" role="alert">{{ message }}</p>
  }
  <pre #scroller class="tail" aria-live="off">@for (line of lines(); track $index) {{{ line }}
}</pre>
  @if (isLoaded() && !error() && lines().length === 0) {
    <p class="hint">No log entries yet.</p>
  }
</main>

<app-bottom-nav />

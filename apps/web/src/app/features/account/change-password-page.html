<main class="change-password">
  <h1>Change your password</h1>
  @if (isForced) {
    <p class="notice" role="status">
      An admin reset your account. Choose a new password to continue —
      nothing else works until you do.
    </p>
  } @else {
    <p class="hint">
      Changing your password signs you out of every other device.
    </p>
  }

  <form (ngSubmit)="submit()">
    <label>
      Current password
      <input
        type="password"
        name="currentPassword"
        [(ngModel)]="currentPassword"
        autocomplete="current-password"
        required
      />
    </label>
    <label>
      New password
      <input
        type="password"
        name="newPassword"
        [(ngModel)]="newPassword"
        autocomplete="new-password"
        minlength="8"
        required
      />
      <span class="sub">At least 8 characters.</span>
    </label>
    <label>
      New password again
      <input
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        autocomplete="new-password"
        required
      />
      @if (confirmPassword.length > 0 && confirmPassword !== newPassword) {
        <span class="sub mismatch">These don't match yet.</span>
      }
    </label>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="primary" [disabled]="!canSubmit">
      {{ isBusy() ? 'Changing…' : 'Change password' }}
    </button>
  </form>
</main>

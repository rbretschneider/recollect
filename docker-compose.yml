name: recollect

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-recollect}
      POSTGRES_USER: ${DB_USER:-recollect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Bind to loopback only by default: the server reaches the DB over the
    # compose network, so publishing to all interfaces on a public host would
    # expose Postgres needlessly. Override DB_BIND for remote admin access.
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recollect} -d ${DB_NAME:-recollect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core API + library engine + built web app, one container.
  # During development run `npm run dev` on the host instead (profile gate).
  server:
    build: .
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-recollect}:${DB_PASSWORD}@db:5432/${DB_NAME:-recollect}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET in .env}
      # Web Push (VAPID). Empty = notifications disabled; generate a keypair and
      # set these in .env to enable the daily look-back push.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@recollect.app}
      # Where scheduled DB backups land. Point it at a library path so your own
      # NAS backup covers them; blank uses the app-data volume.
      BACKUP_DIR: ${BACKUP_DIR:-}
      # Restoring replaces the live database and restarts the server, so it is
      # opt-in. See docs/backup-restore.md.
      RESTORE_ENABLED: ${RESTORE_ENABLED:-}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-7}
      SCAN_INTERVAL_HOURS: ${SCAN_INTERVAL_HOURS:-24}
      # Set to 1 when a reverse proxy (nginx) fronts the app: real client IPs
      # for rate limiting, and Secure session cookies over its HTTPS.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # Where approved guest uploads land as ORIGINALS. Point at the library
      # mount (e.g. /library/Guest Uploads) so the NAS backup covers them;
      # empty keeps them in the app-data volume.
      GUEST_LIBRARY_DIR: ${GUEST_LIBRARY_DIR:-}
      # Outgoing mail (test button in Settings). Any plain SMTP works:
      # Gmail app password (smtp.gmail.com:587), Brevo, SMTP2GO, paid Proton
      # Mail via their SMTP token. Empty host = mail features off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # OIDC single sign-on against a self-hosted IdP (authentik). Empty issuer
      # = no SSO button, feature fully dormant. authentik's issuer URL is
      # per-application: https://auth.example.com/application/o/<slug>/
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
    volumes:
      - app-data:/app/data              # thumbnails, caches, guest uploads — the one place originals land is guest-library/
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library   # photo folder, indexed in place
    ports:
      - "${SERVER_PORT:-8080}:8080"

  # ML sidecar (Phase 2+): faces + CLIP embeddings.
  # ml:
  #   build: apps/ml
  #   restart: unless-stopped

volumes:
  db-data:
  app-data:

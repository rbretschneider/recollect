# Production stack: pulls the prebuilt image from GHCR instead of building.
# Lives on the server at /opt/recollect next to a .env file (see env.example).
name: recollect

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-recollect}
      POSTGRES_USER: ${DB_USER:-recollect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recollect} -d ${DB_NAME:-recollect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/rbretschneider/recollect:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-recollect}:${DB_PASSWORD}@db:5432/${DB_NAME:-recollect}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET in .env}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-7}
      SCAN_INTERVAL_HOURS: ${SCAN_INTERVAL_HOURS:-24}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      TZ: ${TZ:-America/New_York}
    volumes:
      - app-data:/app/data
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  db-data:
  app-data:

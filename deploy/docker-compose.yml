# Production stack: pulls the prebuilt image from GHCR instead of building.
# Lives on the server at /opt/recollect next to a .env file (see env.example).
name: recollect

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-recollect}
      POSTGRES_USER: ${DB_USER:-recollect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recollect} -d ${DB_NAME:-recollect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/rbretschneider/recollect:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-recollect}:${DB_PASSWORD}@db:5432/${DB_NAME:-recollect}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET in .env}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-7}
      SCAN_INTERVAL_HOURS: ${SCAN_INTERVAL_HOURS:-24}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      TRANSCODE_THREADS: ${TRANSCODE_THREADS:-2}
      # Set to http://ml:8000 (and start with --profile ml) to enable faces
      # and semantic search. Empty = ML fully off; everything else works.
      RECOLLECT_ML_URL: ${RECOLLECT_ML_URL:-}
      TZ: ${TZ:-America/New_York}
    volumes:
      - app-data:/app/data
      # The in-app folder picker browses everything under /library. One volume:
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library
      # More volumes: add lines like
      #   - /mnt/tank/videos:/library/videos
    ports:
      - "${SERVER_PORT:-8080}:8080"

  # Faces + CLIP semantic search. Opt-in: COMPOSE_PROFILES=ml (or --profile ml)
  # plus RECOLLECT_ML_URL=http://ml:8000 in .env. GPU by default; a CPU-only
  # box removes the deploy block and sets RECOLLECT_ML_DEVICE=cpu.
  ml:
    image: ghcr.io/rbretschneider/recollect-ml:latest
    restart: unless-stopped
    profiles: ["ml"]
    environment:
      RECOLLECT_ML_DEVICE: ${RECOLLECT_ML_DEVICE:-cuda}
      RECOLLECT_FACE_MODEL: ${RECOLLECT_FACE_MODEL:-antelopev2}
      RECOLLECT_CLIP_MODEL: ${RECOLLECT_CLIP_MODEL:-ViT-L-14}
    volumes:
      - ml-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ML_GPU_DEVICE:-1}"]
              capabilities: [gpu]

volumes:
  db-data:
  app-data:
  ml-models:

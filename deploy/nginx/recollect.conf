# Reference reverse-proxy vhost for Recollect.
#
# Recollect runs helmet with CSP/HSTS disabled (apps/server/src/main.ts) on the
# assumption that TLS termination and security headers live at the proxy. This
# file is that proxy config, committed so the production edge is reviewable and
# reproducible rather than living only on the box.
#
# Swap in your own server_name, certificate paths, and upstream port. Reload
# with: nginx -t && systemctl reload nginx
#
# The upstream MUST be the published container port (SERVER_PORT in .env),
# not the app's internal 8080.

server {
    listen 80;
    listen [::]:80;
    server_name recollect.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recollect.example.com;

    ssl_certificate     /etc/letsencrypt/live/recollect.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recollect.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HTTPS for a year, subdomains included. Set TRUST_PROXY_HOPS=1 in the app
    # so it emits Secure cookies and reads the real client IP from the headers
    # this proxy sets below.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy. The app itself ships no external assets; the only
    # off-origin resources are OpenStreetMap map tiles (Places) and the OSM
    # embed iframe (memory/place maps). 'unsafe-inline' on style-src is required
    # by Angular's injected component styles and Leaflet's inline element styles.
    # helmet already sets X-Content-Type-Options and Referrer-Policy on app
    # responses; only add here what helmet has disabled (HSTS above, CSP here)
    # to avoid conflicting duplicate headers.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-src 'self' https://www.openstreetmap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # A phone video can be 2GB; stream it straight through without buffering
    # the whole body to disk first.
    client_max_body_size 2G;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8087;   # published SERVER_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Append, never trust a client-sent value: this is what makes
        # TRUST_PROXY_HOPS=1 safe.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NG_BUILD_MAX_WORKERS: 3
      OMP_NUM_THREADS: 3
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @recollect/server
      - run: npm run build --workspace @recollect/web
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
      - run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm run test --workspace @recollect/web -- --watch=false
      - run: npm run test:integration --workspace @recollect/server -- --runInBand
      - run: npx jest --maxWorkers=3
        working-directory: apps/server
